[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
evm_version = "paris"
bytecode_hash = "none"
offline = true
ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[fmt]
ignore = ["lib/**", "test/scratch/**"]
